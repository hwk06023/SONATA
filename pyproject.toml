[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonata-asr"
version = "0.3.1"
description = "SONATA: SOund and Narrative Advanced Transcription Assistant - ASR with audio event detection"
authors = [
    {name = "Hyeonwoo Kim", email = "hwkim.work@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["asr", "speech recognition", "audio transcription", "audio events", "whisper"]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "whisperx>=3.1.0",
    "pydub>=0.25.1",
    "librosa>=0.9.1",
    "tqdm>=4.62.3",
    "transformers>=4.30.0",
    "scikit-learn>=1.0.0",
    "webrtcvad-wheels>=2.0.11",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "black>=23.3.0",
    "pre-commit>=3.3.1",
    "pytest>=7.3.1",
]

[project.urls]
"Homepage" = "https://github.com/hwk06023/SONATA"
"Bug Tracker" = "https://github.com/hwk06023/SONATA/issues"
"Documentation" = "https://github.com/hwk06023/SONATA/blob/main/docs"

[tool.setuptools]
packages = ["sonata"]

[project.scripts]
sonata-asr = "sonata.main:main"

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "whisperx.*",
    "torch.*",
    "torchaudio.*", 
    "transformers.*",
    "sklearn.*",
    "webrtcvad.*",
    "soundfile.*",
    "pydub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py" 