remote_theme: just-the-docs/just-the-docs
title: SONATA Documentation
description: "SOund and Narrative Advanced Transcription Assistant: Advanced system for speech recognition and audio event detection"
logo: "/assets/images/sonata-logo.png"
favicon_ico: "/assets/images/favicon.ico"

# Site settings
lang: en-US
baseurl: "/SONATA" # the subpath of your site
url: "https://hwk06023.github.io" # the base hostname & protocol

# Theme settings
color_scheme: "dark" # or "light"
enable_copy_code_button: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Aux links for the upper right navigation
aux_links:
  "SONATA on GitHub":
    - "https://github.com/hwk06023/SONATA"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Sort order for navigation links
nav_sort: case_sensitive

# Footer content
footer_content: "Copyright &copy; 2024 SONATA. Distributed under GPLv3 license."

# Callouts (alerts)
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  danger:
    title: Danger
    color: red
  success:
    title: Success
    color: green

# Markdown settings
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Enable proper page permalinks
permalink: pretty

# Custom header and footer
header_pages:
  - index.md
  - FEATURES.md
  - USAGE.md
  - CLI.md
  - AUDIO_EVENTS.md
  - OFFLINE_DIARIZATION.md

# Lunr search settings
lunr_search:
  excludes: ['feed.xml', 'atom.xml', 'sitemap.xml', 'robots.txt', '404.html']
  min_length: 3
  stopwords: 'stopwords.txt'

# SEO Settings
twitter:
  username: hwk06023
  card: summary
social:
  name: SONATA
  links:
    - https://github.com/hwk06023/SONATA

# Enable mermaid diagrams
mermaid:
  # Version of mermaid library
  version: "9.1.7"
  # Set to true to initialize mermaid on every page load
  initialize: true

# Google Analytics
ga_tracking: 
ga_tracking_anonymize_ip: true

# External scripts to include
external_scripts:
  - href: "https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"
    async: false
    defer: false

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .jekyll-cache/
  - assets/js/build-search-data.js 