name: GitHub Copilot Review Action

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Request Copilot Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log(`Requesting Copilot review for PR #${prNumber}`);
            
            try {
              // Add GitHub Copilot as a reviewer
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: ['github-copilot']
              });
              console.log(`Successfully requested GitHub Copilot review for PR #${prNumber}`);
            } catch (error) {
              console.error(`Error requesting GitHub Copilot review: ${error.message}`);
              
              if (error.message.includes('does not have permission') || error.message.includes('Not Found')) {
                console.log('Note: The "github-copilot" user may not exist as a collaborator in this repository.');
                console.log('Make sure GitHub Copilot is properly configured for your organization/repository.');
              }
            }
            
      - name: Trigger Copilot Explanation Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            try {
              // Post comment explaining what Copilot is doing
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `## GitHub Copilot Review Requested
                
                GitHub Copilot has been requested to review this pull request.
                
                Copilot will analyze the changes and may provide:
                - Code quality suggestions
                - Security recommendations
                - Performance improvement ideas
                - Best practice recommendations
                
                Please wait for Copilot's review before merging this PR.`
              });
            } catch (error) {
              console.error(`Error posting comment: ${error.message}`);
            } 