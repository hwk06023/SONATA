name: Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Add Copilot to reviewers
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            try {
              // Add Copilot as a reviewer
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: ['copilot']
              });
              console.log(`Successfully requested Copilot review for PR #${prNumber}`);
            } catch (error) {
              console.error(`Error requesting Copilot review: ${error.message}`);
              
              // If error contains "User 'copilot' does not have permission" or similar
              if (error.message.includes('does not have permission') || error.message.includes('Not Found')) {
                console.log('Note: "copilot" user may not exist in this repository. Please add Copilot manually as a reviewer in the PR.');
              }
            } 